name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend — lint + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  backend:
    name: Backend — import + migrations
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # Real Postgres so alembic upgrade head actually runs against the same
    # dialect the hospital uses (SQLite would let some things through).
    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_pass
          POSTGRES_DB: ci_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_user"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # Fake values just so the app can import without pydantic-settings errors.
      DATABASE_URL: postgresql+asyncpg://ci_user:ci_pass@localhost:5432/ci_db
      SECRET_KEY: ci_only_not_a_real_secret_1234567890abcdef1234567890abcdef
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "30"
      REFRESH_TOKEN_EXPIRE_DAYS: "7"
      ALLOWED_ORIGINS: http://localhost
      ENVIRONMENT: production
      POSTGRES_DB: ci_db
      POSTGRES_USER: ci_user
      POSTGRES_PASSWORD: ci_pass
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Create test database
        run: PGPASSWORD=ci_pass createdb -h localhost -U ci_user ci_tests
      # Import the app — catches missing deps, syntax errors, model mistakes.
      - name: Import check
        run: python -c "from app.main import app; print('imports ok')"
      # Run migrations against real Postgres — catches broken revisions.
      - name: Alembic upgrade head
        run: alembic upgrade head
      # Guards against a model change landing without its migration: the
      # schema the app expects and the schema the migrations build must match.
      - name: Check models match migrations
        run: alembic check
      - name: Tests
        run: pytest -q
        env:
          # Separate database so the suite's create_all/TRUNCATE can't run
          # against the one alembic just migrated.
          DATABASE_URL: postgresql+asyncpg://ci_user:ci_pass@localhost:5432/ci_tests
          ENVIRONMENT: test
