[alembic]
# Path to the migrations directory (relative to this file).
script_location = alembic

# Tells Alembic to put new revision files alongside others.
prepend_sys_path = .

# Timezone for revision timestamps.
timezone = UTC

# File naming pattern for revisions: 0001_short_title.py
file_template = %%(rev)s_%%(slug)s

# Truncate slugs to keep filenames readable.
truncate_slug_length = 40

# Don't read DATABASE_URL from here — env.py reads it from app.core.config.
sqlalchemy.url = driver://user:pass@host/db


[post_write_hooks]
# (Optional) auto-format generated revision files. Disabled by default.


[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
