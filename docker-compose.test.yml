# Test stack. Runs the suite against a real PostgreSQL, matching CI and prod.
#
#   docker compose -f docker-compose.test.yml run --rm tests
#
# The database is tmpfs-backed and thrown away with the container, so a test
# run never touches the dev volume.

services:
  test-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: test
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d test"]
      interval: 3s
      timeout: 3s
      retries: 10

  tests:
    build: ./backend
    depends_on:
      test-db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://test:test@test-db:5432/test
      # Test-only value. Never used outside this compose file.
      SECRET_KEY: test_secret_not_real_0123456789abcdef0123456789abcdef
      ENVIRONMENT: test
      ALLOWED_ORIGINS: http://localhost
    volumes:
      - ./backend:/app
    working_dir: /app
    command: pytest -q
