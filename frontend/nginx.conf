# Internal nginx for the frontend production image.
# This serves the built SPA bundle. The public-facing nginx in front of
# everything (TLS, rate limiting, headers) lives in the main `nginx` service.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Long-cache hashed assets (Vite emits hash-suffixed filenames).
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback — every unknown path renders index.html so client-side
    # routing (refreshing on /tickets/42, etc.) doesn't 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Don't cache index.html — needs to pick up new bundle hashes on deploy.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }
}
