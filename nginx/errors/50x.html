<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Service temporairement indisponible</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f3f5f7;
        color: #16202b;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      }
      .card {
        max-width: 32rem;
        padding: 2rem 2.5rem;
        background: #ffffff;
        border: 1px solid #d9e0e7;
        border-radius: 8px;
        text-align: center;
      }
      h1 { font-size: 1.5rem; margin: 0 0 .5rem; }
      p  { margin: .25rem 0; color: #5e7080; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Service temporairement indisponible</h1>
      <p>L'application est en cours de redémarrage ou de mise à jour.</p>
      <p>Merci de réessayer dans quelques instants.</p>
    </div>
  </body>
</html>
