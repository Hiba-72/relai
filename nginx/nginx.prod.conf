# Public-facing nginx for the hospital LAN deployment (HTTPS).
#
# Serving over TLS is required: the site firewall blocks plain HTTP to
# the app VM (returns a Fortinet 403 on port 80), but allows HTTPS on 443.
# We terminate TLS here on the nginx container.
#
# Cert files live in ./certs/ on the host and are bind-mounted read-only into
# the container at /etc/nginx/certs/ (see docker-compose.prod.yml). This is a
# plain drop-in mount: to swap the current self-signed cert for a CA-issued
# one, overwrite certs/relai.crt + certs/relai.key on the host and
# restart the nginx service — no config change needed.
#
# Traffic is protected by:
#   - TLS (self-signed today, hospital internal CA later — same file paths)
#   - HSTS (max-age 1 year, includeSubDomains) so browsers won't downgrade
#   - The internal-only network (no public exposure)
#   - The firewall at the network edge
#   - UFW on the server (allow 443 from 192.0.2.0/24, 22 from 192.0.2.0/28)
#
# Pairs with docker-compose.prod.yml. Differences vs the dev nginx.conf:
#   - HTTPS on 443 (port 80 redirects to https://)
#   - Strict CSP (only style-src keeps 'unsafe-inline' — Tailwind + Radix
#     emit inline styles; script-src is fully locked down)
#   - gzip compression on text payloads
#   - Rate limiting on /api/ and /api/v1/auth/
#   - The frontend upstream points to the frontend container's nginx (port 80)
#     instead of the Vite dev server (5173)

events {
    worker_connections 1024;
}

http {
    # --- Common settings ---
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    server_tokens off;
    sendfile      on;
    keepalive_timeout 65;
    client_max_body_size 10M;

    # --- Compression ---
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        application/xml+rss
        image/svg+xml
        font/ttf
        font/otf
        application/font-woff
        application/font-woff2;

    # --- Rate limiting ---
    limit_req_zone $binary_remote_addr zone=api:10m  rate=60r/m;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;

    upstream backend {
        server backend:8000;
    }

    upstream frontend {
        # Frontend container in prod serves the built SPA bundle via its own
        # nginx (frontend/Dockerfile → production stage on port 80).
        server frontend:80;
    }

    # --- HTTP → HTTPS redirect ---
    # Port 80 exists only to bounce accidental http:// visits to https://.
    # In practice the NGFW already blocks 80 from client subnets, but the
    # redirect makes local troubleshooting (curl from the VM itself) sane.
    server {
        listen 80;
        server_name 192.0.2.20 localhost _;

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # --- Main HTTPS server ---
    server {
        listen 443 ssl;
        http2 on;
        server_name 192.0.2.20 localhost _;

        ssl_certificate     /etc/nginx/certs/relai.crt;
        ssl_certificate_key /etc/nginx/certs/relai.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        # --- Security headers ---
        # HSTS: pin the browser to HTTPS for 1 year. Safe here because port 80
        # is only a redirect and the app has no HTTP-only subpath.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # Must be on one line: nginx does NOT support line continuation inside
        # quoted directive values; backslashes would end up in the header.
        # style-src keeps 'unsafe-inline' because Tailwind + Radix emit inline
        # style attributes; script-src is strict. Fonts are self-hosted via
        # @fontsource-variable — no external CDNs allowed (hospital NGFW may
        # block outbound calls to fonts.googleapis.com / fonts.gstatic.com).
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;

        # Custom error pages (DOCTYPE'd, no inline scripts) so a transient
        # backend/frontend outage doesn't render an nginx default page that
        # triggers Quirks Mode and CSP-eval warnings in the browser.
        error_page 502 503 504 /_errors/50x.html;
        location = /_errors/50x.html {
            internal;
            root /usr/share/nginx/html;
        }

        # --- Auth API (stricter rate limit) ---
        location /api/v1/auth/ {
            limit_req zone=auth burst=5 nodelay;
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # --- General API ---
        location /api/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 60s;
        }

        # NOTE: /docs and /openapi.json are intentionally NOT proxied in prod.
        # FastAPI also disables them when ENVIRONMENT=production.

        # --- Frontend (static SPA bundle) ---
        location / {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }
}
